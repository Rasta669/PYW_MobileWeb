<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Paint Your World</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        /* Rotate message overlay */
        #rotate-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            font-size: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 99999;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Rotate screen -->
    <div id="rotate-overlay">Please rotate your device to landscape to play.</div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Paint Your World</div>
        </div>
    </div>

    <script>
        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/docs.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/docs.data",
            frameworkUrl: buildUrl + "/docs.framework.js",
            codeUrl: buildUrl + "/docs.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "UndiscoveredGoats",
            productName: "Paint Your World",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        /* Mobile modifications */
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
            document.getElementsByTagName('head')[0].appendChild(meta);

            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";

            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    document.makeFullscreen('unity-container');
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

        /* -------- ROTATION CHECK -------- */
        const rotateOverlay = document.getElementById("rotate-overlay");

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateOverlay.style.display = "flex";
                canvas.style.display = "none";
            } else {
                rotateOverlay.style.display = "none";
                canvas.style.display = "block";
            }
        }

        checkOrientation();

        window.addEventListener("resize", () => {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
            checkOrientation();
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                checkOrientation();
            }, 200);
        });
    </script>

</body>
</html>
